# Example automations for the Bark Detector add-on.
# Paste into Settings -> Automations -> Create -> Edit in YAML.

# ---------------------------------------------------------------------------
# Recommended: trigger on the entity created by MQTT discovery.
# Survives broker and Home Assistant restarts, appears in history and logbook,
# and is editable in the UI.
#
# The sensor clears itself 10 s after an event (off_delay), so while a dog keeps
# barking the state stays "on" and this fires ONCE per barking session rather
# than once per bark. That is usually what you want for a notification.
# ---------------------------------------------------------------------------
alias: Dog Bark Alert
triggers:
  - trigger: state
    entity_id: binary_sensor.bark_detector_bark
    to: "on"
conditions: []
actions:
  - action: notify.notify
    data:
      message: >-
        🐶 Bark detected (confidence
        {{ state_attr('binary_sensor.bark_detector_bark', 'score') }})
mode: single
# Optional extra actions:
#  - action: switch.turn_on
#    target:
#      entity_id: switch.porch_camera_record

# ---------------------------------------------------------------------------
# Alternative: trigger on the raw MQTT message.
# Fires once per EVENT rather than per session, so use this if you want every
